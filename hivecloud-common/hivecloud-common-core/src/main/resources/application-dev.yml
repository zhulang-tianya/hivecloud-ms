spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host:localhost}:${mysql.port:3306}/hivecloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root

  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hivecloud.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

hivecloud:
  heartbeat:
    interval: 1000
    unhealthy-threshold: 3000
    remove-threshold: 4000
  redis:
    metadata-ttl: 30000
    heartbeat-ttl: 5000

logging:
  level:
    com.hivecloud: debug
    org.springframework: info
