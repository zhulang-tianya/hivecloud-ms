spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host:localhost}:${mysql.port:3306}/hivecloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: root
    hikari:
      maximum-pool-size: 20        # 最大连接数
      minimum-idle: 5              # 最小空闲连接
      connection-timeout: 30000    # 连接超时 30s
      idle-timeout: 600000         # 空闲超时 10min
      max-lifetime: 1800000        # 最大生命周期 30min
      connection-test-query: SELECT 1

  data:
    redis:
      host: ${redis.host:localhost}
      port: ${redis.port:6379}
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16           # 最大连接数
          max-idle: 8              # 最大空闲连接
          min-idle: 2              # 最小空闲连接
          max-wait: 1000ms         # 获取连接超时 1s

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hivecloud.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

hivecloud:
  heartbeat:
    interval: 1000
    unhealthy-threshold: 3000
    remove-threshold: 4000
  redis:
    metadata-ttl: 30000
    heartbeat-ttl: 5000

logging:
  level:
    com.hivecloud: debug
    org.springframework: info
