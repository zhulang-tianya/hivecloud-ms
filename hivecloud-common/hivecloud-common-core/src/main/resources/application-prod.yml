spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host:prod-mysql}:${mysql.port:3306}/hivecloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  data:
    redis:
      host: ${redis.host:prod-redis}
      port: ${redis.port:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hivecloud.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

hivecloud:
  heartbeat:
    interval: 1000
    unhealthy-threshold: 3000
    remove-threshold: 4000
  redis:
    metadata-ttl: 30000
    heartbeat-ttl: 5000

logging:
  level:
    com.hivecloud: warn
    org.springframework: error
  file:
    name: /var/log/hivecloud/application.log
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
