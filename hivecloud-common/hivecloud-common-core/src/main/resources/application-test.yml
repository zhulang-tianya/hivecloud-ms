spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${mysql.host:test-mysql}:${mysql.port:3306}/hivecloud?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD:test123}

  data:
    redis:
      host: ${redis.host:test-redis}
      port: ${redis.port:6379}
      password: ${REDIS_PASSWORD:test123}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3000ms

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hivecloud.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

hivecloud:
  heartbeat:
    interval: 1000
    unhealthy-threshold: 3000
    remove-threshold: 4000
  redis:
    metadata-ttl: 30000
    heartbeat-ttl: 5000

logging:
  level:
    com.hivecloud: info
    org.springframework: warn
