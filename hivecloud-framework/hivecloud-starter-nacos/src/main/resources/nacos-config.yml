# Nacos 配置中心统一配置
# 通过 Maven 资源过滤自动替换占位符

spring:
  cloud:
    nacos:
      # 服务注册中心配置
      discovery:
        server-addr: ${nacos.server-addr}
        username: ${nacos.username}
        password: ${nacos.password}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        register-enabled: true
        watch-enabled: true
      
      # 配置中心配置
      config:
        server-addr: ${nacos.server-addr}
        username: ${nacos.username}
        password: ${nacos.password}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        file-extension: yaml
        enabled: true
        refresh-enabled: true
        shared-configs:
          - data-id: hivecloud-common.yaml
            group: ${nacos.group}
            refresh: true
