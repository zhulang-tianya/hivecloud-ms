spring:
  application:
    name: hivecloud-system
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hivecloud_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000
  # Redis 配置已迁移到 Nacos 配置中心 (hivecloud-common.yaml)
  # 本地不再配置 Redis，完全依赖 Nacos 配置

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hivecloud.system.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.hivecloud.system: DEBUG
    com.alibaba.cloud.nacos: DEBUG

# JWT 配置
jwt:
  secret: HiveCloud-Secret-Key-2026-For-JWT-Token-Signing
  expiration: 1800000
  refresh-expiration: 300000

# 验证码配置
captcha:
  enabled: true
  expiration: 300

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh-CN
