spring:
  application:
    name: hivecloud-system
  profiles:
    active: dev
  config:
    import:
      - nacos:hivecloud-common.yaml
      - nacos:hivecloud-system.yaml
  cloud:
    nacos:
      # Nacos 服务注册中心配置
      discovery:
        server-addr: ${nacos.server-addr}
        username: ${nacos.username}
        password: ${nacos.password}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        register-enabled: true
        watch-enabled: true
      
      # Nacos 配置中心配置
      config:
        server-addr: ${nacos.server-addr}
        username: ${nacos.username}
        password: ${nacos.password}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        file-extension: yaml
        enabled: true
        refresh-enabled: true
        shared-configs:
          - data-id: hivecloud-common.yaml
            group: ${nacos.group}
            refresh: true
        extension-configs:
          - data-id: hivecloud-system.yaml
            group: ${nacos.group}
            refresh: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hivecloud_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hivecloud.system.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.hivecloud.system: DEBUG
    com.alibaba.cloud.nacos: DEBUG

# JWT 配置
jwt:
  secret: HiveCloud-Secret-Key-2026-For-JWT-Token-Signing
  expiration: 1800000
  refresh-expiration: 300000

# 验证码配置
captcha:
  enabled: true
  expiration: 300

# Knife4j 配置
knife4j:
  enable: true
  setting:
    language: zh-CN
