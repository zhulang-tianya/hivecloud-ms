spring:
  application:
    name: hivecloud-gateway
  profiles:
    active: dev
  config:
    import:
      - nacos:hivecloud-common.yaml
      - nacos:hivecloud-gateway.yaml
  cloud:
    nacos:
      # Nacos 服务注册中心配置
      discovery:
        server-addr: ${nacos.server-addr}
        username: ${nacos.username}
        password: ${nacos.password}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        register-enabled: true
        watch-enabled: true
      
      # Nacos 配置中心配置
      config:
        server-addr: ${nacos.server-addr}
        username: ${nacos.username}
        password: ${nacos.password}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        file-extension: yaml
        enabled: true
        refresh-enabled: true
        shared-configs:
          - data-id: hivecloud-common.yaml
            group: ${nacos.group}
            refresh: true
        extension-configs:
          - data-id: hivecloud-gateway.yaml
            group: ${nacos.group}
            refresh: true
    gateway:
      routes:
        - id: system
          uri: lb://hivecloud-system
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=1
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

hivecloud:
  gateway:
    jwt:
      secret: hivecloud-secret-key-must-be-at-least-32-chars
      permit-all:
        - /api/system/v1/login
        - /api/system/v1/register

logging:
  level:
    root: INFO
    com.hivecloud.gateway: DEBUG
    com.alibaba.cloud.nacos: DEBUG
