spring:
  application:
    name: hivecloud-gateway
  cloud:
    nacos:
      # Nacos 服务注册中心配置
      discovery:
        server-addr: ${nacos.server-addr}
        username: ${nacos.username}
        password: ${nacos.password}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        register-enabled: true
        watch-enabled: true
      
      # Nacos 配置中心配置
      config:
        server-addr: ${nacos.server-addr}
        username: ${nacos.username}
        password: ${nacos.password}
        namespace: ${nacos.namespace}
        group: ${nacos.group}
        file-extension: yaml
        enabled: true
        refresh-enabled: true
        shared-configs:
          - data-id: hivecloud-common.yaml
            group: ${nacos.group}
            refresh: true
        extension-configs:
          - data-id: hivecloud-gateway.yaml
            group: ${nacos.group}
            refresh: true
